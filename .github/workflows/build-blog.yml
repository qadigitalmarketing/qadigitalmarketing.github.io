name: Build reusable blog

on:
  push:
    branches: ["main", "master"]
    paths:
      - "blog-data.js"
      - "blog-post.html"
      - "build-blog.py"
      - "blog.html"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build article pages
        run: python3 build-blog.py

      - name: Commit generated blog pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build blog article pages"
            git push
          fi
